name: Workbench synthetic regression
on:
  push:
    branches: [feat/xingce-workbench-v8]
    paths: ['xingce_project/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['xingce_project/**', '.github/workflows/workbench.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/xingce_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r xingce_project/apps/workbench/backend/requirements.txt
      - run: |
          python -m unittest discover -s xingce_project/tests_backend -p 'test_*.py'
          python -m unittest discover -s xingce_project/tests_pipeline -p 'test_*.py'
          python -m unittest discover -s xingce_project/tests_acceptance -p 'test_*.py'
      - working-directory: xingce_project/apps/workbench/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Install browser test client
        timeout-minutes: 3
        run: npm install --prefix /tmp/xingce-browser --no-audit --no-fund playwright@1.62.1
      - name: Select available browser or install Chromium
        timeout-minutes: 5
        run: |
          if command -v google-chrome > /dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            /tmp/xingce-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Browser regression with synthetic content
        timeout-minutes: 3
        run: |
          python xingce_project/tests_e2e/serve.py > /tmp/xingce-e2e-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766/api/catalog');break
              except OSError:time.sleep(0.5)
          else:raise SystemExit('synthetic server not ready')
          PY
          PLAYWRIGHT_MODULE=/tmp/xingce-browser/node_modules/playwright node xingce_project/tests_e2e/regression.mjs
